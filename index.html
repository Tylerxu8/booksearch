<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Book Search</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="app-bar">
	<h1>Book Search</h1>
  </header>
  <main>
  	<section id="view-home" data-route="/">
  		<p>Home - content arrives tomorrow.</p>
  	</section>
  	<section id="view-search" data-route="/search" hidden>
  		<form id="search-form">
  			<label for="search-input">Search books</label>
  			<input type="text" id="search-input" name="q" autocomplete="off">
  			<button type="submit">Search</button>
  		</form>
  		<p id="status" aria-live="polite"></p>
  		<ul id="results"></ul>
  		<button type="button" id="load-more" hidden>Load more</button>
  	</section>
  	<section id="view-shelf" data-route="/shelf" hidden>
  		<h2>My shelf</h2>
  		<ul id="shelf"></ul>
  	</section>
  </main>
	<nav id="tab-bar" aria-label="Primary">
		<a href="#/" class="tab" data-route="/">Home</a>
		<a href="#/search" class="tab" data-route="/search">Search</a>
		<a href="#/shelf" class="tab" data-route="/shelf">Shelf</a>
	</nav>
	<script type="module" src="app.js"></script>	
</body>
</html>
