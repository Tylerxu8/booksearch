<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Book Search</title>
</head>
<body>
	<h1>Book Search</h1>
	<form id="search-form">
		<label for="search-input">Search books</label>
		<input type="text" id="search-input" name="q" autocomplete="off">
		<button type="submit">Search</button>
	</form>
	<section aria-label="Search results">
		<ul id="results"></ul>
	</section>
	<section aria-label="Your shelf">
		<h2>My Shelf</h2>
		<ul id="shelf"></ul>
	</section>
</body>
</html>
