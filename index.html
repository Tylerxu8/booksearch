<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Book Search</title>
	<meta name="description" content="Search Open Library for books, save the ones you want to read, and mark them read.">
	<meta property="og:title" content="Book Search">
	<meta property="og:description" content="Search Open Library for books, save the ones you want to read, and mark them read.">
	<meta property="og:type" content="website">
	<meta name="twitter:card" content="summary">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
	<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="app-bar">
	<h1 id="brand-title">Book Search</h1>
	<h1 id="page-title"></h1>
  </header>
  <main>
  	<section id="view-home" data-route="/">
  		<p id="home-status" aria-live="polite"></p>
  		<div id="home-rows"></div>
  	</section>
  	<section id="view-shelf" data-route="/shelf" hidden>
  		<h2>My shelf</h2>
  		<div class="shelf-filters" role="group" aria-label="Filter shelf">
  			<button type="button" class="filter-btn active" data-filter="all">All</button>
  			<button type="button" class="filter-btn" data-filter="want">Want to read</button>
  			<button type="button" class="filter-btn" data-filter="read">Read</button>
  		</div>
  		<ul id="shelf"></ul>
  	</section>
  	<section id="view-genres" data-route="/genres" hidden>
  		<div id="genre-list-view">
  			<h2>Genres</h2>
  			<div id="genre-list"></div>
  		</div>
  		<div id="genre-detail-view" hidden>
  			<button type="button" id="genre-back" class="back-link">‹ All genres</button>
  			<h2 id="genre-detail-title"></h2>
  			<ul id="genre-results"></ul>
  			<button type="button" id="genre-load-more" hidden>Load more</button>
  		</div>
  	</section>
  </main>
  <dialog id="search-modal" aria-label="Search">
  	<form id="search-form">
  		<label for="search-input">Search books</label>
  		<div class="input-wrap">
  			<input type="text" id="search-input" name="q" autocomplete="off">
  			<button type="button" id="clear-search" aria-label="Clear search" hidden>×</button>
  		</div>
  		<button type="submit">Search</button>
  	</form>
  	<p id="status" aria-live="polite">Search for a book to get started.</p>
  	<ul id="results"></ul>
  	<button type="button" id="load-more" hidden>Load more</button>
  </dialog>
	<nav id="tab-bar" aria-label="Primary">
		<div id="sidebar-brand">
			<span class="brand-icon">📚</span>
			<span>Book Search</span>
		</div>
		<a href="#/" class="tab" data-route="/">
			<svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/></svg>
			<span>Home</span>
		</a>
		<button type="button" class="tab" id="search-trigger" aria-haspopup="dialog">
			<svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
			<span>Search</span>
		</button>
		<a href="#/shelf" class="tab" data-route="/shelf">
			<svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="3" height="18" rx="1"/><rect x="10.5" y="6" width="3" height="15" rx="1"/><rect x="17" y="3" width="3" height="18" rx="1"/></svg>
			<span>Shelf</span>
		</a>
		<a href="#/genres" class="tab" data-route="/genres">
			<svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
			<span>Genres</span>
		</a>
	</nav>
	<div id="toast" role="status" aria-live="polite"></div>
	<script type="module" src="app.js"></script>
</body>
</html>
