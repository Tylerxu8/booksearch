<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Book Search</title>
	<meta name="description" content="Search Open Library for books, save the ones you want to read, and mark them read.">
	<meta property="og:title" content="Book Search">
	<meta property="og:description" content="Search Open Library for books, save the ones you want to read, and mark them read.">
	<meta property="og:type" content="website">
	<meta name="twitter:card" content="summary">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
	<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="app-bar">
	<h1>Book Search</h1>
  </header>
  <main>
  	<section id="view-home" data-route="/">
  		<p id="home-status" aria-live="polite"></p>
  		<div id="home-rows"></div>
  	</section>
  	<section id="view-search" data-route="/search" hidden>
  		<form id="search-form">
  			<label for="search-input">Search books</label>
  			<div class="input-wrap">
  				<input type="text" id="search-input" name="q" autocomplete="off">
  				<button type="button" id="clear-search" aria-label="Clear search" hidden>×</button>
  			</div>
  			<button type="submit">Search</button>
  		</form>
  		<p id="status" aria-live="polite">Search for a book to get started.</p>
  		<ul id="results"></ul>
  		<button type="button" id="load-more" hidden>Load more</button>
  	</section>
  	<section id="view-shelf" data-route="/shelf" hidden>
  		<h2>My shelf</h2>
  		<div class="shelf-filters" role="group" aria-label="Filter shelf">
  			<button type="button" class="filter-btn active" data-filter="all">All</button>
  			<button type="button" class="filter-btn" data-filter="want">Want to read</button>
  			<button type="button" class="filter-btn" data-filter="read">Read</button>
  		</div>
  		<ul id="shelf"></ul>
  	</section>
  </main>
	<nav id="tab-bar" aria-label="Primary">
		<a href="#/" class="tab" data-route="/">Home</a>
		<a href="#/search" class="tab" data-route="/search">Search</a>
		<a href="#/shelf" class="tab" data-route="/shelf">Shelf</a>
	</nav>
	<div id="toast" role="status" aria-live="polite"></div>
	<script type="module" src="app.js"></script>
</body>
</html>
